name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Compile every module
        run: python -m compileall -q deskmark
      - name: Unit tests
        run: python -m pytest -q
      - name: CLI smoke test
        shell: bash
        run: |
          export DESKMARK_HOME="$RUNNER_TEMP/deskmark-ci"
          deskmark --version
          deskmark doctor
          deskmark save ci-smoke --no-browser --no-agents
          deskmark list
          deskmark show --json > /dev/null
          deskmark packet > /dev/null
          deskmark resume --json > /dev/null
          deskmark gc --days 0 > /dev/null
          echo "smoke ok"

      - name: Demo machine (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/demo.sh

      - name: MCP protocol smoke test
        shell: bash
        run: |
          export DESKMARK_HOME="$RUNNER_TEMP/deskmark-ci"
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"server/discover","params":{"_meta":{}}}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/list"}' \
            | deskmark mcp > "$RUNNER_TEMP/mcp.out" 2>/dev/null
          python - <<'PY'
          import json, os
          lines = [l for l in open(os.path.join(os.environ["RUNNER_TEMP"], "mcp.out")) if l.strip()]
          replies = [json.loads(l) for l in lines]
          assert len(replies) == 3, replies
          assert all("id" in r for r in replies), "responses must correlate by id"
          assert replies[0]["result"]["protocolVersion"] == "2025-06-18"
          assert "2026-07-28" in replies[1]["result"]["supportedVersions"]
          assert {"resume_latest", "resume_point_save"} <= {t["name"] for t in replies[2]["result"]["tools"]}
          print("mcp ok")
          PY

  package:
    name: Package · build + install from wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Install the wheel into a clean venv and run it
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/deskmark --version
          DESKMARK_HOME=/tmp/pkg-home /tmp/venv/bin/deskmark doctor
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
