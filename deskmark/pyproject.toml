[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deskmark"
version = "1.0.0"
description = "Resume points for your whole desk: save where your work is, put it back, hand it to an agent."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Sarthak Mhaske" }]
keywords = ["resume", "workspace", "session", "mcp", "agents", "local-first", "privacy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: User Interfaces",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/<your-username>/deskmark"
Specification = "https://github.com/<your-username>/deskmark/blob/main/docs/spec.md"
Issues = "https://github.com/<your-username>/deskmark/issues"

[project.scripts]
deskmark = "deskmark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["deskmark"]

[tool.hatch.build.targets.sdist]
include = ["deskmark", "tests", "docs", "scripts", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
